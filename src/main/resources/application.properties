spring.application.name=Sneaky
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:${SERVER_PORT:8081}}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/Sneaky}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.default_batch_fetch_size=${SPRING_JPA_DEFAULT_BATCH_FETCH_SIZE:50}

jwt.secret=${JWT_SECRET}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.username=${SPRING_DATA_REDIS_USERNAME:}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=${SPRING_DATA_REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${SPRING_DATA_REDIS_CONNECT_TIMEOUT:2s}

app.kafka.enabled=${APP_KAFKA_ENABLED:false}
app.kafka.topics.user-activity=${APP_KAFKA_TOPIC_USER_ACTIVITY:sneaky.user-activity}

app.recommendations.ml.enabled=${APP_ML_RECOMMENDATIONS_ENABLED:false}
app.recommendations.ml.base-url=${APP_ML_RECOMMENDATIONS_BASE_URL:http://localhost:8090}
app.recommendations.ml.timeout=${APP_ML_RECOMMENDATIONS_TIMEOUT:500ms}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${SPRING_KAFKA_CONSUMER_GROUP_ID:sneaky-analytics}
spring.kafka.consumer.auto-offset-reset=${SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET:earliest}
spring.kafka.consumer.properties.spring.json.trusted.packages=com.sneaky.sneaky.dto.analytics
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.max.block.ms=${SPRING_KAFKA_PRODUCER_MAX_BLOCK_MS:1000}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.sneaky.sneaky.dto.analytics.UserActivityEventDTO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.refresh-cookie.secure=${APP_AUTH_REFRESH_COOKIE_SECURE:false}
app.auth.refresh-cookie.same-site=${APP_AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
app.rate-limit.enabled=${APP_RATE_LIMIT_ENABLED:true}
app.rate-limit.login.limit=${APP_RATE_LIMIT_LOGIN_LIMIT:10}
app.rate-limit.login.window-seconds=${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:30}
app.rate-limit.register.limit=${APP_RATE_LIMIT_REGISTER_LIMIT:10}
app.rate-limit.register.window-seconds=${APP_RATE_LIMIT_REGISTER_WINDOW_SECONDS:30}
app.rate-limit.refresh.limit=${APP_RATE_LIMIT_REFRESH_LIMIT:300}
app.rate-limit.refresh.window-seconds=${APP_RATE_LIMIT_REFRESH_WINDOW_SECONDS:60}
app.rate-limit.public-read.limit=${APP_RATE_LIMIT_PUBLIC_READ_LIMIT:240}
app.rate-limit.public-read.window-seconds=${APP_RATE_LIMIT_PUBLIC_READ_WINDOW_SECONDS:60}
app.rate-limit.user-mutation.limit=${APP_RATE_LIMIT_USER_MUTATION_LIMIT:60}
app.rate-limit.user-mutation.window-seconds=${APP_RATE_LIMIT_USER_MUTATION_WINDOW_SECONDS:60}
app.rate-limit.analytics.limit=${APP_RATE_LIMIT_ANALYTICS_LIMIT:60}
app.rate-limit.analytics.window-seconds=${APP_RATE_LIMIT_ANALYTICS_WINDOW_SECONDS:60}
app.cart-reminders.enabled=${APP_CART_REMINDERS_ENABLED:true}
app.cart-reminders.age-days=${APP_CART_REMINDERS_AGE_DAYS:2}
app.cart-reminders.cron=${APP_CART_REMINDERS_CRON:0 0 9 * * *}
app.cart-reminders.email.from=${APP_CART_REMINDERS_EMAIL_FROM:no-reply@sneaky.local}

spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

sneaky.admin.emails=${SNEAKY_ADMIN_EMAILS:}
